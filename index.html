<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cuando la noche era grana — Escenario 3D</title>
<style>
  * { box-sizing: border-box; }
  html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#100d22; }
  body { font-family:Georgia,'Times New Roman',serif; }
  #info { position:fixed;z-index:2;bottom:26px;left:30px;color:#ffe5c9;pointer-events:none;text-shadow:0 2px 12px #130916; }
  #info h1 { font-size:clamp(22px,3vw,35px);font-weight:normal;line-height:1.05;margin:0 0 8px; }
  #info p { font:12px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin:0; }
  #ayuda { position:fixed;z-index:2;right:22px;top:20px;color:#f5d4c1;font:12px/1.5 Arial,sans-serif;opacity:.85;text-align:right;pointer-events:none; }
  #estadoModelo { position:fixed; z-index:3; left:30px; top:20px; color:#ffe1bc; font:12px/1.5 Arial,sans-serif; background:#1c1027c9; border:1px solid #b9797759; padding:7px 11px; border-radius:7px; max-width:min(420px,65vw); }
  #estadoModelo:empty { display:none; }
  #panelObra { position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(10,6,16,.85);padding:22px; }
  #panelObra.activo { display:flex; }
  .tarjeta { position:relative;width:min(92vw,850px);max-height:90vh;overflow:auto;padding:22px;background:linear-gradient(155deg,#40223c,#180e22);border:1px solid #a46c74;border-radius:18px;color:#ffe5ca;box-shadow:0 20px 60px #0009; }
  .tarjeta img { display:block;width:100%;max-height:65vh;object-fit:contain;border-radius:10px;background:#1c1122; }
  .tarjeta h2 { font-weight:normal;margin:14px 0 7px;font-size:26px; }
  .tarjeta p { font:14px/1.5 Arial,sans-serif;margin:0;color:#efcebb; }
  #cerrar { position:absolute;right:13px;top:13px;width:40px;height:40px;border:0;border-radius:50%;font-size:25px;cursor:pointer;color:white;background:#200f20c9; }
</style>

<body>
<div id="info"><h1>Cuando la noche era grana</h1><p>Un paisaje inspirado en la obra de Daniel Correa Mejía</p></div>
<div id="estadoModelo" aria-live="polite">Cargando escultura 3D…</div>
<div id="ayuda">Arrastra para mirar · Rueda para acercar<br>Haz clic en las estrellas grandes para ver obras</div>

    <button id="cerrar" aria-label="Cerrar fotografía">×</button>
    <img id="imagenObra" alt="Obra de la exposición" />

    <p id="textoObra"></p>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ============================================================
// 1. ESCENA Y CÁMARA
// ============================================================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 250);
camera.position.set(0, 8, 28);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,3,-3);
controls.enableDamping=true;
controls.enablePan=false;
controls.minDistance=14;
controls.maxDistance=34; // La cámara no atraviesa la cordillera
controls.maxPolarAngle=Math.PI/2.02;
controls.update();

// ============================================================
// 2. CIELO Y LUNA
// ============================================================
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(110,48,32),
  new THREE.ShaderMaterial({
    side:THREE.BackSide,
    vertexShader:`varying vec3 d;void main(){d=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 d;void main(){float h=normalize(d).y;vec3 horizonte=vec3(.62,.14,.24);vec3 medio=vec3(.23,.10,.26);vec3 noche=vec3(.035,.035,.11);vec3 c=mix(horizonte,medio,smoothstep(-.03,.32,h));c=mix(c,noche,smoothstep(.2,.88,h));gl_FragColor=vec4(c,1.);}`
  })
));
function brillo(x,y,z,radio,color,opacidad,contenedor=scene){
  const m=new THREE.Mesh(new THREE.SphereGeometry(radio,24,16),new THREE.MeshBasicMaterial({color,transparent:true,opacity:opacidad,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.position.set(x,y,z);contenedor.add(m);return m;
}
brillo(-13,19,-42,3.2,0xffa567,.06);
brillo(-13,19,-42,2.3,0xffd4a1,.08);
const luna=new THREE.Mesh(new THREE.SphereGeometry(1.3,32,24),new THREE.MeshBasicMaterial({color:0xffdb9e}));
luna.position.set(-13,19,-41);scene.add(luna);

// Estrellitas pequeñas distribuidas por todo el cielo, no solo atrás
const fondoEstrellas=[];
for(let i=0;i<230;i++){
  const ang=Math.random()*Math.PI*2;
  const radio=65+Math.random()*18;
  fondoEstrellas.push(Math.cos(ang)*radio,13+Math.random()*35,Math.sin(ang)*radio);
}
const puntosGeo=new THREE.BufferGeometry();
puntosGeo.setAttribute('position',new THREE.Float32BufferAttribute(fondoEstrellas,3));
scene.add(new THREE.Points(puntosGeo,new THREE.PointsMaterial({color:0xffd1a4,size:.18,transparent:true,opacity:.85})));

// ============================================================
// 3. MONTAÑAS: CADA LADO SE PUEDE MOVER POR SEPARADO
// ============================================================
// MODIFICA SOLO x o z del lado que quieras mover:
const posicionMontanas={
  atras:     {x:  0, z:-51, giro:0},
  frente:    {x:  0, z: 51, giro:Math.PI},
  izquierda: {x:-51, z:  0, giro:Math.PI/2},
  derecha:   {x: 51, z:  0, giro:-Math.PI/2}
};

function relieve(base,altura,color,semilla){
  const forma=new THREE.Shape();
  forma.moveTo(-58,-7);
  for(let i=0;i<=116;i++){
    const x=-58+i;
    const y=base+altura*(
      .34*Math.sin(x*.115+semilla)+
      .23*Math.sin(x*.23+semilla*1.6)+
      .12*Math.cos(x*.48+semilla*2)
    );
    forma.lineTo(x,y);
  }
  forma.lineTo(58,-7);
  forma.closePath();
  return new THREE.Mesh(new THREE.ShapeGeometry(forma),new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide}));
}
const gruposMontanas={};
function crearLado(nombre,indice){
  const cfg=posicionMontanas[nombre];
  const grupo=new THREE.Group();
  const variacion=indice*1.35;
  // Tres capas progresivas, todas LEJOS de la isla central.
  const lejana=relieve(7.3,4.3,0x70293c,.7+variacion);
  const media=relieve(5.0,3.6,0x45223d,1.9+variacion);
  const cercana=relieve(2.8,2.8,0x231b32,3.4+variacion);
  lejana.position.z=0;
  media.position.z=6;
  cercana.position.z=12;
  grupo.add(lejana,media,cercana);
  grupo.rotation.y=cfg.giro;
  grupo.position.set(cfg.x,0,cfg.z);
  scene.add(grupo);
  gruposMontanas[nombre]=grupo;
}
Object.keys(posicionMontanas).forEach(crearLado);
// Ejemplos para desplazar una sola cordillera (sin mover las otras):
// gruposMontanas.izquierda.position.x -= 5;
// gruposMontanas.derecha.position.x += 5;
// gruposMontanas.atras.position.z -= 5;
// gruposMontanas.frente.position.z += 5;

// ============================================================
// 4. AGUA ANIMADA
// ============================================================
const aguaMaterial=new THREE.ShaderMaterial({
  uniforms:{tiempo:{value:0}},
  vertexShader:`uniform float tiempo;varying vec2 u;void main(){u=uv;vec3 p=position;p.z+=.08*sin(p.x*.7+tiempo)+.07*sin(p.y*1.2+tiempo*1.3);gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
  fragmentShader:`uniform float tiempo;varying vec2 u;void main(){float onda=sin(u.y*160.+sin(u.x*24.+tiempo)*3.+tiempo*1.8);float b=pow(max(0.,onda),7.)*.23;float r=1.-smoothstep(.02,.28,abs(u.x-.35));vec3 oscuro=vec3(.055,.06,.16);vec3 vino=vec3(.35,.075,.15);vec3 c=mix(oscuro,vino,(1.-u.y)*.55);c+=vec3(.7,.23,.14)*b*(.3+.7*r);gl_FragColor=vec4(c,1.);}`
});
const agua=new THREE.Mesh(new THREE.PlaneGeometry(130,130,130,120),aguaMaterial);
agua.rotation.x=-Math.PI/2;
agua.position.set(0,-1.2,7);scene.add(agua);

// ============================================================
// 5. ISLA CENTRAL + TU MODELO GLB REAL
// ============================================================
const roca=new THREE.Mesh(new THREE.SphereGeometry(1,36,18),new THREE.MeshStandardMaterial({color:0x2b172c,roughness:1}));
roca.scale.set(8,1.05,4.1); roca.position.set(0,-1,7);scene.add(roca);
const borde=new THREE.Mesh(new THREE.SphereGeometry(1,30,14),new THREE.MeshStandardMaterial({color:0x512333,roughness:1}));
borde.scale.set(7.2,.24,3.55); borde.position.set(0,-.15,7);scene.add(borde);

// Coloca TU archivo real en: modelos/escultura.glb
// El modelo NO viene dentro de este HTML: debes poner tu .glb en esa carpeta.
const RUTA_MODELO='statue.glb';
const ANCHO_MODELO=10;       // cambia este número para hacerlo más grande o pequeño
const ALTURA_MAXIMA=4.5;     // limita modelos con una orientación extraña
const GIRO_MODELO=0;         // gira sobre el eje Y: Math.PI/2, Math.PI, etc.
const OSCURECER_MODELO=0.72; // 1 = color original; 0.72 = piedra más oscura
const estadoModelo=document.getElementById('estadoModelo');
const grupoEscultura=new THREE.Group();
grupoEscultura.position.set(0,0.01,8);
scene.add(grupoEscultura);
const glbLoader=new GLTFLoader();
glbLoader.load(RUTA_MODELO,(gltf)=>{
  const modelo=gltf.scene;
  modelo.rotation.y=GIRO_MODELO;
  // Normalizar tamaño automáticamente sin deformar sus proporciones originales.
  let caja=new THREE.Box3().setFromObject(modelo);
  const tam=caja.getSize(new THREE.Vector3());
  if(tam.length()<0.00001){estadoModelo.textContent='El archivo GLB no contiene una geometría visible.';return;}
  const factor=Math.min(ANCHO_MODELO/Math.max(tam.x,tam.z,0.001),ALTURA_MAXIMA/Math.max(tam.y,0.001));
  modelo.scale.multiplyScalar(factor);
  caja=new THREE.Box3().setFromObject(modelo);
  const centro=caja.getCenter(new THREE.Vector3());
  // Centra horizontalmente y deja la base de la escultura sobre la isla.
  modelo.position.set(-centro.x,-caja.min.y,-centro.z);
  modelo.traverse((pieza)=>{
    if(!pieza.isMesh)return;
    pieza.castShadow=true;
    pieza.receiveShadow=true;
    // Clona materiales para no modificar otros objetos que pudieran compartirlos.
    const ajustarMaterial=(material)=>{
      const copia=material.clone();
      if(copia.color)copia.color.multiplyScalar(OSCURECER_MODELO);
      if('roughness' in copia)copia.roughness=Math.max(copia.roughness||0,0.85);
      return copia;
    };
    pieza.material=Array.isArray(pieza.material)?pieza.material.map(ajustarMaterial):ajustarMaterial(pieza.material);
  });
  grupoEscultura.add(modelo);
  estadoModelo.textContent='';
},undefined,(error)=>{
  console.error('No se pudo cargar el modelo GLB:',error);
  estadoModelo.textContent='Falta el modelo: guarda tu archivo como modelos/escultura.glb';
});

// Iluminación tenue y cálida para leer la forma de la escultura.
const focoEscultura=new THREE.SpotLight(0xffad81,38,32,Math.PI/5,0.65,1.5);
focoEscultura.position.set(-3,11,13);
focoEscultura.target.position.set(0,1,7);
scene.add(focoEscultura,focoEscultura.target);
brillo(0,1.8,5.2,2.4,0xff8b66,.035);

// ============================================================
// 6. ANIMALES EN SILUETA, INSPIRADOS EN LOS TEXTOS DE LA EXPOSICIÓN
//    Son ilustraciones nuestras, NO imágenes de las obras originales.
// ============================================================
// Dibujamos las siluetas con Canvas y las colocamos como sprites 3D.
// Así se entienden aunque gires la cámara.
function animalEnEscena(nombre,camino,x,y,z,ancho,alto,color='#2a1726'){
  const lienzo=document.createElement('canvas');lienzo.width=512;lienzo.height=512;
  const ctx=lienzo.getContext('2d');
  ctx.save();ctx.translate(48,60);ctx.scale(1.45,1.45);
  const silueta=new Path2D(camino);
  ctx.shadowColor='#ff8752';ctx.shadowBlur=18;
  ctx.fillStyle=color;ctx.strokeStyle='#d47a67';ctx.lineWidth=5;
  ctx.lineJoin='round';ctx.fill(silueta);ctx.stroke(silueta);ctx.restore();
  const textura=new THREE.CanvasTexture(lienzo);
  textura.colorSpace=THREE.SRGBColorSpace;
  const objeto=new THREE.Sprite(new THREE.SpriteMaterial({map:textura,transparent:true,depthWrite:false,alphaTest:.03}));
  objeto.position.set(x,y,z);objeto.scale.set(ancho,alto,1);
  objeto.userData.nombre=nombre;
  scene.add(objeto);return objeto;
}

// Perfil de zorro, con orejas y cola grande.
animalEnEscena('Zorro',
 'M20 192 Q35 150 65 162 Q38 134 26 125 Q54 119 86 157 L125 150 L144 112 L160 143 Q189 130 215 145 L230 117 L248 151 L265 157 L277 174 L252 189 L241 183 L237 233 L215 233 L211 192 L138 195 L133 234 L113 234 L105 187 Q70 208 29 221 L20 192 Z',
 -13,2.6,0,4.3,3.3,'#2e1926');

// Perro, con hocico, oreja y cuatro patas.
animalEnEscena('Perro',
 'M30 170 Q21 134 43 112 Q46 142 64 156 L137 148 L157 125 L182 143 L198 121 L228 137 L245 154 L270 165 L252 184 L226 183 L221 233 L201 233 L195 188 L133 190 L128 231 L107 231 L102 182 Q64 199 42 186 L28 212 L16 207 Z',
 13,2.7,8,3.8,3.0,'#301825');

// Rana cerca de la orilla de la isla.
animalEnEscena('Rana',
 'M57 210 Q37 189 58 162 L90 150 Q100 112 117 114 L127 123 Q143 111 165 120 L181 110 Q199 120 198 153 L222 165 Q239 186 224 205 L245 216 L226 230 L192 213 Q146 232 108 217 L74 237 L53 227 L70 208 Z',
 -5.6,0.7,10.4,2.35,1.9,'#30202e');

// Ave volando entre las estrellas.
animalEnEscena('Ave',
 'M22 163 Q66 113 106 131 Q133 149 145 156 Q179 111 259 153 Q213 155 181 180 Q158 191 145 217 Q126 190 106 181 Q70 156 22 163 Z',
 9,15,-17,4.7,3.2,'#301b37');

// Delfín sobre el agua, ligeramente inclinado.
animalEnEscena('Delfín',
 'M24 189 Q72 125 139 142 L151 112 L166 142 Q202 142 239 166 L270 139 L257 176 L280 203 L232 188 Q201 215 162 200 L125 224 L130 189 Q84 194 24 189 Z',
 9,2.0,-6,4.7,3.1,'#281b37');

// Dos serpientes cósmicas, en forma de cintas suaves al fondo.
function serpienteCosmica(puntos,color,desfase){
  const curva=new THREE.CatmullRomCurve3(puntos.map(p=>new THREE.Vector3(...p)));
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(curva,120,.09,9,false),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.60}));
  scene.add(mesh);
  return {mesh,desfase};
}
const serpientes=[
  serpienteCosmica([[-7,12,-15],[-4,12.7,-16],[-2,11.9,-16],[0,13,-16],[3,12,-16],[6,12.8,-16]],0xd87968,0),
  serpienteCosmica([[-7,13.5,-15.5],[-4,12.7,-16.5],[-2,13.8,-16.5],[0,12.5,-16.5],[3,13.8,-16.5],[6,12.8,-16.5]],0xf3ad80,1.7)
];

// ============================================================
// 6. PLANTAS Y PARTÍCULAS MÁS DISTRIBUIDAS
// ============================================================
function tallo(puntos,color,grosor){
  const curva=new THREE.CatmullRomCurve3(puntos.map(p=>new THREE.Vector3(...p)));
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curva,30,grosor,6,false),new THREE.MeshStandardMaterial({color,roughness:1})));
}
for(const lado of [-1,1]){
  for(let i=0;i<9;i++){
    const x=lado*(5.5+Math.random()*12);
    const z=1+Math.random()*18;
    const h=1+Math.random()*2.7;
    tallo([[x,-1,z],[x+lado*.2,h*.3,z],[x+lado*(.4+Math.random()*.7),h,z]],0x251b31,.04);
  }
}
const luciernagas=[];
for(let i=0;i<160;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.035+Math.random()*.045,8,6),new THREE.MeshBasicMaterial({color:i%3===0?0xff996c:0xffd1a3,transparent:true,opacity:.8}));
  m.position.set((Math.random()-.5)*42,.2+Math.random()*12,-19+Math.random()*41);
  m.userData.y=m.position.y;m.userData.fase=Math.random()*6.28;
  scene.add(m);luciernagas.push(m);
}

// ============================================================
// 7. ESTRELLAS GRANDES QUE ABREN FOTOGRAFÍAS
// ============================================================
// Pon tus fotos en la carpeta "imagenes" junto al index.html
const obrasData=[
  {titulo:'Nuevos días',descripcion:'Daniel Correa Mejía, 2024. Obra seleccionada para la investigación.',
  imagen:'Imagen3.jpg',posicion:[-18,16,-19]},
  {titulo:'Otra obra de la exposición',descripcion:'Fotografía tomada durante la visita al Claustro de San Agustín.',
  imagen:'Imagen2.jpg',posicion:[18,17,-22]},
  {titulo:'Paisajes de Cuando la noche era grana',descripcion:'Otra obra que forma parte del recorrido expositivo.',
  imagen:'Imagen6.jpg',posicion:[0,21,-29]},
  {titulo:'Otra obra de la exposición',descripcion:'Fotografía tomada durante la visita al Claustro de San Agustín.',
  imagen:'Imagen7.jpg',posicion:[10,12,-22]},
];
const estrellasClic=[];
function formaEstrella(){
  const s=new THREE.Shape();
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5-Math.PI/2;
    const r=i%2===0?1.0:.45;
    const x=Math.cos(a)*r,y=Math.sin(a)*r;
    if(i===0)s.moveTo(x,y);else s.lineTo(x,y);
  }
  s.closePath();return new THREE.ShapeGeometry(s);
}
const geoEstrella=formaEstrella();
obrasData.forEach((obra,i)=>{
  const grupo=new THREE.Group();
  const aura=new THREE.Mesh(geoEstrella,new THREE.MeshBasicMaterial({color:0xff9e5e,transparent:true,opacity:.25,depthWrite:false,side:THREE.DoubleSide}));
  aura.scale.setScalar(1.85);
  const estrella=new THREE.Mesh(geoEstrella,new THREE.MeshBasicMaterial({color:0xffdf9b,side:THREE.DoubleSide}));
  grupo.add(aura,estrella);
  grupo.position.set(...obra.posicion);
  grupo.userData={...obra,fase:i*2.0,aura};
  scene.add(grupo);estrellasClic.push(grupo);
});

// ============================================================
// 8. ILUMINACIÓN
// ============================================================
scene.add(new THREE.AmbientLight(0xaa7295,1.65));
const luz=new THREE.PointLight(0xff8557,65,19);
luz.position.set(0,4,9);scene.add(luz);

// ============================================================
// 9. VENTANA DE FOTOGRAFÍAS Y CLICS
// ============================================================
const panel=document.getElementById('panelObra');
const imagen=document.getElementById('imagenObra');
const titulo=document.getElementById('tituloObra');
const texto=document.getElementById('textoObra');
function abrirObra(d){imagen.src=d.imagen;imagen.alt=d.titulo;titulo.textContent=d.titulo;texto.textContent=d.descripcion;panel.classList.add('activo');}
function cerrarObra(){panel.classList.remove('activo');}
document.getElementById('cerrar').addEventListener('click',cerrarObra);
panel.addEventListener('click',e=>{if(e.target===panel)cerrarObra();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarObra();});
const raycaster=new THREE.Raycaster();const mouse=new THREE.Vector2();
function estrellasBajoPuntero(e){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(estrellasClic,true);
  return hits.length?hits[0].object.parent:null;
}
let inicioPuntero=null;
renderer.domElement.addEventListener('pointerdown',e=>{inicioPuntero={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!inicioPuntero||panel.classList.contains('activo'))return;
  const dist=Math.hypot(e.clientX-inicioPuntero.x,e.clientY-inicioPuntero.y);
  inicioPuntero=null;
  if(dist>6)return; // Girar la cámara no abre fotos accidentalmente
  const estrella=estrellasBajoPuntero(e);
  if(estrella)abrirObra(estrella.userData);
});
renderer.domElement.addEventListener('pointermove',e=>{
  renderer.domElement.style.cursor=estrellasBajoPuntero(e)?'pointer':'grab';
});

// ============================================================
// 10. ANIMACIÓN
// ============================================================
const reloj=new THREE.Clock();
function animar(){
  requestAnimationFrame(animar);
  const t=reloj.getElapsedTime();
  aguaMaterial.uniforms.tiempo.value=t*.45;
  // Las serpientes varían levemente de brillo sin moverse del fondo.
  serpientes.forEach(s=>s.mesh.material.opacity=.4+.18*(.5+.5*Math.sin(t*.9+s.desfase)));
  luciernagas.forEach(m=>{
    m.position.y=m.userData.y+Math.sin(t*.8+m.userData.fase)*.25;
    m.material.opacity=.55+.35*(.5+.5*Math.sin(t*1.5+m.userData.fase));
  });
  estrellasClic.forEach(s=>{
    s.quaternion.copy(camera.quaternion); // siempre miran hacia la cámara
    const pulso=1+Math.sin(t*2+s.userData.fase)*.12;
    s.scale.setScalar(pulso);
    s.userData.aura.material.opacity=.17+.13*(.5+.5*Math.sin(t*2.1+s.userData.fase));
  });
  controls.update();
  renderer.render(scene,camera);
}
animar();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
